server.address=${HOST:127.0.0.1}
server.port=${PORT:3000}
spring.servlet.multipart.max-file-size=25000000B
spring.servlet.multipart.max-request-size=25064000B
spring.servlet.multipart.resolve-lazily=true
spring.sql.init.mode=always
archivo.base-datos=${ARCHIVO_DB:.data/archivo.sqlite}
archivo.maps-key=${GOOGLE_MAPS_API_KEY:}
archivo.maps-id=${GOOGLE_MAPS_MAP_ID:DEMO_MAP_ID}
archivo.cookie-segura=${COOKIE_SEGURA:false}
